name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_py_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar sintaxis (py_compile)
        run: python -m compileall main.py config database middleware model routes schemas services utils

      - name: Lint con ruff
        run: ruff check .

      - name: Ejecutar tests
        run: pytest tests -q
        env:
          JWT_SECRET: "ci-test-secret-with-at-least-32-characters!!"
          ENVIRONMENT: "development"
          MONGO_URL: "mongodb://localhost:27017"
          DB_NAME: "chatpy_ci"

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_py_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat_py_frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check (tsc)
        run: npm run type-check

      - name: Build de produccion
        run: npm run build