services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Sin mapeo de puertos: solo accesible dentro de la red del compose.
    # (Si tu Mongo local ocupa 27017, el mapeo chocaría con él.)
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./chat_py_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Obligatorio: sin JWT_SECRET el stack no arranca (falla rápido con mensaje claro).
      # Generar uno: python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: "${JWT_SECRET:?Falta JWT_SECRET - exporta un secreto de 32+ caracteres antes de levantar el stack}"
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: chatpydb
      # development = cookies sin Secure (HTTP local). production = Secure + SameSite=None,
      # requiere HTTPS (las cookies se rechazan sin TLS y el login no persiste).
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # SMTP real obligatorio para que los usuarios confirmen su cuenta.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./chat_py_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  backend_uploads:
